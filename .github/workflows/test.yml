env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  RAILS_ENV: e2e
  SECRET_KEY_BASE: f54c9d76c42e397e17cbc0d0a024da5a762a7a0d934839b417a77dac6fda65a49a37b32bcd229ac5fd5c1fedef8ed6acf7a57ed6465d6339862cdc0dfab8886f
  AUTH_SECRET: secret
  CONTACT_EMAIL: contact@example.com
  RESPONSIBLE_EMAIL: responsible@example.com
  FRONTEND_URL: http://localhost:4000
  OBSERVATIONS_TOOL_URL: http://localhost:4200
  CYPRESS_API_PATH: ../otp_api

name: Run tests

on: push

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Portal
        uses: actions/checkout@v7

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"

      - name: Cache Portal Node Modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ steps.nvm.outputs.NVMRC }}-${{ hashFiles('package.json', 'yarn.lock') }}

      - name: Install Portal Dependencies
        run: yarn install --frozen-lockfile

      # vitest.config.mjs supplies the env vars constants/layers.js reads, so no .env is needed
      - name: Run unit tests
        run: yarn test:coverage

      - name: Upload Unit Coverage
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-unit
          path: coverage/unit
          if-no-files-found: ignore

  # E2E runs against an instrumented build, so this keeps the real production build checked.
  build:
    name: Production Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Portal
        uses: actions/checkout@v7

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"

      - name: Cache Portal Node Modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ steps.nvm.outputs.NVMRC }}-${{ hashFiles('package.json', 'yarn.lock') }}

      - name: Install Portal Dependencies
        run: yarn install --frozen-lockfile

      # Same as the E2E job; the build loads modules that read these.
      - name: Set Portal ENV Variables
        run: |
          echo "
          PORT=4000
          ENV=production
          NODE_ENV=production
          OTP_COUNTRIES='COG,CMR,COD,CAF,GAB'
          OTP_COUNTRIES_IDS='7,47,45,188,53'
          APP_URL=http://localhost:4000
          OTP_API=http://localhost:3000
          DISABLE_HOTJAR=true
          CRITICAL_CSS=true
          " > .env

      - name: Cache Next.js Build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('yarn.lock') }}

      - name: Build Portal
        run: yarn build

  test:
    name: E2E Tests
    runs-on: ubuntu-24.04

    strategy:
      # Without this, one failing shard cancels the others and their results are lost.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    services:
      redis:
        image: redis
        ports: ["6379:6379"]
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]

    steps:
      - name: Checkout Portal
        uses: actions/checkout@v7

      - name: Checkout OTP API
        uses: actions/checkout@v7
        with:
          repository: wri/fti_api
          ref: master
          path: otp_api

      - name: Save OTP API Commit SHA
        id: otp_api_commit_sha
        working-directory: otp_api
        run: echo "VALUE=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Install mjml
        run: npm install -g mjml@4

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"

      # The install below is skipped on a hit, so package.json is in the key too.
      - name: Cache Portal Node Modules
        id: cache-portal-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ steps.nvm.outputs.NVMRC }}-${{ hashFiles('package.json', 'yarn.lock') }}

      # --immutable is a no-op on yarn 1; --frozen-lockfile is the real flag.
      - name: Install Portal Dependencies
        run: yarn install --frozen-lockfile

      - name: Set Portal ENV Variables
        run: |
          echo "
          PORT=4000
          ENV=production
          NODE_ENV=production
          SECRET=946bd4887fa5eea44256377ca06fc798f431359e1b1885e0d9ac570c1f24d8fe3e5863855d02d61e375729a330f5c7d84606ca1bf735b0676eb368321a119637
          OTP_COUNTRIES='COG,CMR,COD,CAF,GAB'
          OTP_COUNTRIES_IDS='7,47,45,188,53'
          APP_URL=http://localhost:4000
          OTP_API=http://localhost:3000
          DISABLE_HOTJAR=true
          CRITICAL_CSS=true
          " > .env

      # Separate from the Production Build cache: instrumented modules would only miss there.
      - name: Cache Next.js Build
        id: cache-nextjs
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-coverage-${{ hashFiles('yarn.lock') }}

      # Backgrounded so the Next.js production build overlaps the API setup below
      # rather than running after it. Blocked on further down. Instrumented for coverage.
      - name: Start Portal
        run: |
          nohup sh -c 'yarn build:coverage && yarn start' > otp-portal.log 2>&1 &
          echo "portal building in background, pid $!"

      # Cypress's ~800 MB binary lives in ~/.cache/Cypress. Installed here rather than
      # after "Wait for Portal" so a miss overlaps the background build.
      - name: Cache E2E Dependencies
        id: cache-e2e-deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/Cypress
            e2e/node_modules
          key: e2e-deps-${{ steps.nvm.outputs.NVMRC }}-${{ hashFiles('e2e/package.json', 'e2e/yarn.lock') }}

      - name: Install E2E Dependencies
        working-directory: e2e
        run: yarn install --frozen-lockfile

      # The runner image points apt at azure.archive.ubuntu.com via a mirrorlist.
      # With three shards hitting it at once it intermittently stops answering and
      # apt burns minutes retrying before it falls back. Use the canonical archive.
      - name: Refresh apt index
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/Id' /etc/apt/apt-mirrors.txt
          fi
          # Stale lists resolve to versions the archive no longer carries, which 404s
          # on a cache miss.
          sudo apt-get update -qq

      # Bump `version` to rebuild the cache. The key also covers resolved package
      # versions, so upstream releases invalidate it on their own.
      - name: Install API dependencies
        timeout-minutes: 8
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        env:
          DEBIAN_FRONTEND: noninteractive
        with:
          packages: gdal-bin libgdal-dev imagemagick
          version: "1"
          execute_install_scripts: true

      # gdal, rgeo and pg are compiled against the apt libraries, so the gem cache has
      # to follow the apt one. CACHE_KEY is the package-set hash the step above exports.
      - name: Setup API Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: otp_api
          cache-version: apt-${{ env.CACHE_KEY }}

      - name: Cache API Precompiled Assets
        id: cache-api-precompiled-assets
        uses: actions/cache@v6
        with:
          path: otp_api/public/assets
          key: api-precompiled-assets-${{ steps.otp_api_commit_sha.outputs.VALUE }}

      - name: Setup API
        working-directory: otp_api
        env:
          APP_URL: http://localhost:3000
        run: |
          bin/rails e2e:setup ${{ steps.cache-api-precompiled-assets.outputs.cache-hit == 'true' && 'SKIP_ASSETS_RESET=true' || '' }}

      - name: Run API Server
        working-directory: otp_api
        env:
          APP_URL: http://localhost:3000
        run: |
          bin/rails s > log/e2e.log 2>&1 &

      - name: Wait for Portal
        timeout-minutes: 8
        run: |
          npx --yes wait-on -t 300000 http://localhost:4000 \
            || { echo '--- portal build log ---'; cat otp-portal.log; exit 1; }

      - name: Run E2E Tests
        working-directory: e2e
        env:
          SPLIT: 3
          SPLIT_INDEX: ${{ matrix.shard }}
          # Balances shards by recorded spec duration; without it specs split by name
          # and operator.cy.js could land beside pages.cy.js.
          SPLIT_FILE: timings.json
          # Only written when an output file is named, and only for specs that passed.
          # The Coverage Report job merges the shards back into one timings.json.
          SPLIT_OUTPUT_FILE: timings-${{ matrix.shard }}.json
          COVERAGE: "true"
        run: yarn cypress run

      - name: Upload E2E Timings
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-timings-${{ matrix.shard }}
          path: e2e/timings-${{ matrix.shard }}.json
          if-no-files-found: ignore

      - name: Upload E2E Coverage
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-e2e-${{ matrix.shard }}
          path: coverage/e2e
          if-no-files-found: ignore

      - name: Uploading Test Artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-tests-artifacts-${{ matrix.shard }}
          path: |
            otp-portal.log
            e2e/cypress/screenshots
            e2e/cypress/videos
            e2e/cypress/e2e/__image_snapshots__
            otp_api/log

  coverage:
    name: Coverage Report
    runs-on: ubuntu-24.04
    needs: [unit, test]
    # Failing tests still leave coverage worth looking at.
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout Portal
        uses: actions/checkout@v7

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"

      # Same key as the E2E job, so this is normally a hit.
      - name: Cache Portal Node Modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ steps.nvm.outputs.NVMRC }}-${{ hashFiles('package.json', 'yarn.lock') }}

      - name: Install Portal Dependencies
        run: yarn install --frozen-lockfile

      - name: Download Unit Coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-unit
          merge-multiple: true
          path: coverage/unit

      # Each shard lands in its own coverage/e2e/coverage-e2e-N folder; the report reads them all.
      - name: Download E2E Coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-e2e-*
          path: coverage/e2e

      # Each shard times only the specs it ran, so they are merged back into one file
      - name: Download E2E Timings
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: e2e-timings-*
          path: timings

      - name: Merge E2E Timings
        run: |
          node script/merge-e2e-timings timings/*/*.json | tee timings.txt
          { echo '```'; cat timings.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY

      - name: Upload E2E Timings
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings
          path: e2e/timings.json

      - name: Merge Coverage
        run: |
          yarn --silent coverage:report | tee report.txt
          { echo '```'; cat report.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/combined
