name: GFW layers smoke test

# Checks the GFW tile and metadata URLs the maps depend on still work. These are live
# network calls, so this runs on a schedule instead of on push.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: GFW Layers
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Portal
        uses: actions/checkout@v7

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"

      - name: Cache Portal Node Modules
        id: cache-portal-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('yarn.lock') }}

      - name: Install Portal Dependencies
        run: yarn install --immutable

      - name: Run GFW smoke tests
        run: yarn test:smoke
